name: Build Local Creator APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Debug for first test; release requires private signing secrets
        type: choice
        options:
          - debug
          - release
        default: debug
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCAL_CREATOR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOCAL_CREATOR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOCAL_CREATOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOCAL_CREATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing private signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/local-creator.jks"
          chmod 600 "$RUNNER_TEMP/local-creator.jks"
      - name: Build debug test installer
        if: inputs.variant == 'debug'
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Build release installer
        if: inputs.variant == 'release'
        env:
          LOCAL_CREATOR_KEYSTORE: ${{ runner.temp }}/local-creator.jks
          LOCAL_CREATOR_STORE_PASSWORD: ${{ secrets.LOCAL_CREATOR_STORE_PASSWORD }}
          LOCAL_CREATOR_KEY_ALIAS: ${{ secrets.LOCAL_CREATOR_KEY_ALIAS }}
          LOCAL_CREATOR_KEY_PASSWORD: ${{ secrets.LOCAL_CREATOR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify installer signature
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LocalCreator-${{ inputs.variant }}
          path: app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/local-creator.jks"
